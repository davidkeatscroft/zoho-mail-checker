<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mail Checker for Zoho</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg hidden xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></symbol>
    <symbol id="i-compose" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8zM3 4h18v4H3zM10 12h4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-spam" viewBox="0 0 24 24"><path d="M12 3l9 16H3L12 3zM12 10v4M12 17v.01"/></symbol>
    <symbol id="i-reply" viewBox="0 0 24 24"><path d="M10 7L4 12l6 5M4 12h10a6 6 0 0 1 6 6v1"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15 7"/></symbol>
  </svg>

  <header class="bar">
    <h1 id="title">Zoho Mail</h1>
    <button class="icon" id="refresh" title="Check now"><svg><use href="#i-refresh"/></svg></button>
    <button class="icon" id="compose" title="Compose in Zoho Mail"><svg><use href="#i-compose"/></svg></button>
    <button class="icon" id="open-inbox" title="Open Zoho Mail"><svg><use href="#i-open"/></svg></button>
    <button class="icon" id="settings" title="Settings"><svg><use href="#i-settings"/></svg></button>
  </header>

  <main id="list-view" class="scroll" tabindex="-1"></main>

  <section id="read-view" hidden>
    <div class="bar">
      <button class="icon" id="back" title="Back (u)"><svg><use href="#i-back"/></svg></button>
      <span class="spacer"></span>
      <button class="icon" data-action="markRead" title="Mark as read (m)"><svg><use href="#i-check"/></svg></button>
      <button class="icon" data-action="archive" title="Archive (e)"><svg><use href="#i-archive"/></svg></button>
      <button class="icon" data-action="spam" title="Report spam (!)"><svg><use href="#i-spam"/></svg></button>
      <button class="icon" data-action="delete" title="Move to Trash (d)"><svg><use href="#i-trash"/></svg></button>
      <button class="icon" id="reply" title="Reply (r)"><svg><use href="#i-reply"/></svg></button>
      <button class="icon" id="open-message" title="Open in Zoho Mail"><svg><use href="#i-open"/></svg></button>
    </div>
    <div class="message-head">
      <h2 id="read-subject"></h2>
      <p id="read-from"></p>
      <p id="read-date" class="muted"></p>
    </div>
    <div id="remote-banner" hidden>
      <span>Remote images are blocked.</span>
      <button class="link" id="load-images">Load images</button>
    </div>
    <p id="read-status" class="muted status" hidden></p>
    <iframe id="body-frame" title="Message" sandbox="allow-same-origin"></iframe>
    <form id="reply-form" hidden>
      <label>To <input id="reply-to" type="text" required autocomplete="off"></label>
      <textarea id="reply-body" rows="5" placeholder="Write a plain-text reply" required></textarea>
      <div class="reply-actions">
        <button type="button" class="link" id="reply-cancel">Cancel</button>
        <button type="submit" class="primary" id="reply-send">Send</button>
      </div>
    </form>
  </section>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
